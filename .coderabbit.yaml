# Uses the installed plan only. This configuration does not purchase a plan.
language: he-IL
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    # This static site keeps authored source in dist, not generated output.
    - "**/dist/**"
    - '!dist/courses/**'
    - '!dist/samples/**'
    - '!dist/vendor/**'
